# MEDILINK Healthcare CI/CD Pipeline

## Overview
This CI/CD pipeline provides automated testing, validation, and deployment for the MEDILINK Healthcare application. It includes comprehensive security scanning, quality checks, and deployment automation.

## Requirements
- GitHub repository with Actions enabled
- Environment variables configured for secrets (GitHub Secrets)
- Proper Docker setup for deployment

## Workflow Files

### 1. Main CI/CD Workflow (`.github/workflows/medilink-ci-cd.yml`)

```yaml
name: MedilINK CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Security scan job
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Backend)
        run: |
          cd backend
          npm ci

      - name: Install dependencies (Frontend)
        run: |
          cd frontend
          npm ci

      - name: Run security audit
        run: |
          npm audit --audit-level moderate

      - name: Check for vulnerabilities
        run: |
          npx audit-ci --moderate

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # Quality and testing job
  quality-check:
    name: Quality and Testing
    runs-on: ubuntu-latest
    needs: security-scan
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (Backend)
        run: |
          cd backend
          npm ci

      - name: Install dependencies (Frontend)
        run: |
          cd frontend
          npm ci

      - name: Validate configuration
        run: |
          cd backend
          npm run validate:config

      - name: TypeScript check (Backend)
        run: |
          cd backend
          npm run typecheck

      - name: TypeScript check (Frontend)
        run: |
          cd frontend
          npm run typecheck

      - name: Lint code (Backend)
        run: |
          cd backend
          npm run lint

      - name: Lint code (Frontend)
        run: |
          cd frontend
          npm run lint

      - name: Run unit tests (Backend)
        run: |
          cd backend
          npm run test -- --coverage

      - name: Run unit tests (Frontend)
        run: |
          cd frontend
          npm run test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

      - name: Upload frontend coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  # Build and deploy job
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    strategy:
      matrix:
        environment: [staging, production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Backend)
        run: |
          cd backend
          npm ci

      - name: Install dependencies (Frontend)
        run: |
          cd frontend
          npm ci

      - name: Validate configuration
        run: |
          cd backend
          npm run validate:config

      - name: Build application (Backend)
        run: |
          cd backend
          npm run build

      - name: Build application (Frontend)
        run: |
          cd frontend
          npm run build

      - name: Deploy to staging (if staging)
        if: matrix.environment == 'staging'
        run: |
          echo "Deploying to staging environment"
          # Add your staging deployment commands here

      - name: Deploy to production (if production)
        if: matrix.environment == 'production'
        run: |
          echo "Deploying to production environment"
          # Add your production deployment commands here
          # For example, using Docker:
          # docker build -t medilink/backend ./backend
          # docker push medilink/backend:latest

  # Documentation and lint job
  documentation:
    name: Documentation and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Backend)
        run: |
          cd backend
          npm ci

      - name: Install dependencies (Frontend)
        run: |
          cd frontend
          npm ci

      - name: Generate documentation
        run: |
          cd backend
          npm run docs:generate
          cd frontend
          npm run docs:generate

      - name: Check for lint issues
        run: |
          cd backend
          npm run lint -- --quiet
          cd frontend
          npm run lint -- --quiet

      - name: Upload documentation
        uses: actions/upload-artifact@v3
        with:
          name: documentation
          path: docs/

  # Performance testing job
  performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Backend)
        run: |
          cd backend
          npm ci

      - name: Install dependencies (Frontend)
        run: |
          cd frontend
          npm ci

      - name: Run Lighthouse CI for frontend
        uses: subosito/github-actions-toolkit/lighthouse-ci@v1
        with:
          source: ${{ github.event.repository.html_url }}
          urls: |
            http://localhost:3000
            http://localhost:3001

      - name: Run Artillery load test for backend
        run: |
          cd backend
          npm install -g artillery
          artillery run ./load-test.yml

  # Security compliance job
  security-compliance:
    name: Security Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Backend)
        run: |
          cd backend
          npm ci

      - name: Run security compliance checks
        run: |
          cd backend
          npm run security:compliance

      - name: Generate security report
        run: |
          cd backend
          npm run security:report

      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security-report/
```
