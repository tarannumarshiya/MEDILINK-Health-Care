services:
  - type: web
    name: medilink-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.x
      # The following variables MUST be added securely in the Render dashboard:
      # - NEXT_PUBLIC_SUPABASE_URL
      # - NEXT_PUBLIC_SUPABASE_ANON_KEY
      # - SUPABASE_SERVICE_ROLE_KEY
      # - RAZORPAY_KEY_ID
      # - RAZORPAY_KEY_SECRET
      - key: CORS_ORIGINS
        # Comma-separated list of allowed frontend origins.
        # Update with your actual Vercel frontend URL before deploying.
        value: http://localhost:3000,https://your-app.vercel.app
